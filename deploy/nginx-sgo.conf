# nginx para SGO Tublood.
#
#   sudo cp deploy/nginx-sgo.conf /etc/nginx/sites-available/sgo
#   sudo ln -s /etc/nginx/sites-available/sgo /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Este archivo es el server block de HTTP a secas. El de HTTPS lo escribe
# Certbot encima (`certbot --nginx -d sgo.tublood.com`), que agrega el bloque
# 443, el certificado y la redirección desde el 80.

server {
    listen 80;
    listen [::]:80;
    server_name sgo.tublood.com;

    root /var/www/sgo/public;
    index index.php;

    charset utf-8;

    # Los adjuntos de clientes y observaciones aceptan hasta 10 MB por archivo
    # (ver la regla `max:10240` de los controllers). Con 12M queda margen para
    # el overhead del multipart y para subir varios de una.
    client_max_body_size 12M;

    # No anunciar la versión de nginx ni dejar la app embebible en un iframe.
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Los Excel de clientes y proveedores arman miles de filas con
        # PhpSpreadsheet y el PDF de observaciones se genera con DomPDF: los dos
        # pueden tardar más que el default de 60s.
        fastcgi_read_timeout 300;
    }

    # `storage/app/private` no se sirve nunca directo: los adjuntos salen por
    # rutas de Laravel que chequean permisos antes de entregar el archivo. Esto
    # corta cualquier intento de llegar a un dotfile por la puerta de atrás.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/sgo-access.log;
    error_log  /var/log/nginx/sgo-error.log;
}
